# Payment (dupla 3): el servicio gRPC y su base propia.
#
# Solo, para probar Payment sin el resto:
#   docker compose -f docker-compose.payment.yml up -d --build
# Sumado al compose del grupo (mismo proyecto y misma red):
#   docker compose -f docker-compose.yml -f docker-compose.payment.yml up -d --build
#
# Para la demo del circuit breaker. Los -f van siempre: sin ellos, Compose lee solo
# docker-compose.yml y no conoce el servicio payment.
#   docker compose -f docker-compose.yml -f docker-compose.payment.yml stop payment
#   docker compose -f docker-compose.yml -f docker-compose.payment.yml start payment
#
# Sigue las convenciones del compose del grupo: la base sin puertos publicados,
# passwords con valor por defecto para desarrollo y configuración de .NET por
# variables de entorno (Seccion__Clave).
name: reserva-asientos

services:
  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: PaymentDb
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment-dev}
    volumes:
      - payment_data:/var/lib/postgresql/data
    networks:
      - reservas
    healthcheck:
      # -h fuerza TCP: en el primer arranque, Postgres levanta un servidor temporal
      # que solo escucha el socket local, y sin -h daría sano antes de tiempo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U payment -d PaymentDb"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  payment:
    build:
      context: ./TP-ProgramacionIV
      dockerfile: PaymentAPI/Dockerfile
    image: payment-api:local
    environment:
      # GSS Encryption Mode=Disable: sin esto Npgsql intenta Kerberos y, como la
      # imagen no trae libgssapi, deja un error en el log al arrancar.
      ConnectionStrings__PaymentDb: Host=payment-db;Port=5432;Database=PaymentDb;Username=payment;Password=${PAYMENT_DB_PASSWORD:-payment-dev};GSS Encryption Mode=Disable
      # Las claves del realm se bajan por la red interna; el emisor es el que
      # figura en los tokens (KC_HOSTNAME=http://localhost:8080 en el compose del grupo).
      Authentication__Authority: http://keycloak:8080/realms/${KEYCLOAK_REALM:-reservas-realm}
      Authentication__ValidIssuer: http://localhost:8080/realms/${KEYCLOAK_REALM:-reservas-realm}
      Authentication__RequireHttpsMetadata: "false"
      # false mientras el realm del grupo no tenga el mapper de audiencia payment-api
      # en el cliente booking-api: hoy sus tokens salen sin aud. Payment lo avisa en
      # el log al arrancar. Con el mapper, PAYMENT_VALIDATE_AUDIENCE=true.
      Authentication__ValidateAudience: ${PAYMENT_VALIDATE_AUDIENCE:-false}
      BancoSimulado__RetardoMs: ${PAYMENT_RETARDO_MS:-0}
    # Solo para probar desde el host (grpcurl). Booking llega por la red interna
    # en http://payment:8080 y no lo necesita.
    ports:
      - "127.0.0.1:5260:8080"
    depends_on:
      payment-db:
        condition: service_healthy
    networks:
      - reservas
    restart: unless-stopped

networks:
  reservas:

volumes:
  payment_data:
