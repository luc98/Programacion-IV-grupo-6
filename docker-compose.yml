name: reserva-asientos

services:
  keycloak-db:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-dev}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    networks:
      - reservas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-dev}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - reservas
    restart: unless-stopped

  booking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: BookingDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:-postgrespassword}
    volumes:
      - booking_data:/var/lib/postgresql/data
    networks:
      - reservas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BookingDb"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  notification-service:
    build: ./TP-ProgramacionIV/NotificationService
    image: notification-service:local
    ports:
      - "127.0.0.1:5050:5050"
    networks:
      - reservas
    restart: unless-stopped

networks:
  reservas:

volumes:
  keycloak_data:
  booking_data:
