version: '3.8'

services:
  # --- INFRAESTRUCTURA DE SEGURIDAD Authorization Server ---
  keycloak-db:
    image: postgres:15
    container_name: keycloak_postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: admin6
    ports:
      - "5432:5432"
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    networks:
      - booking_network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak_server
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: admin6
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db
    networks:
      - booking_network

  # --- BASES DE DATOS DE MICROSERVICIOS booking API ---
  booking-db:
    image: postgres:16-alpine
    container_name: postgres-booking
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: BookingDb
    ports:
      - "5433:5432" 
    volumes:
      - postgres_booking_data:/var/lib/postgresql/data
    networks:
      - booking_network

  payment-db:
    image: postgres:16-alpine
    container_name: payment_db
    environment:
      POSTGRES_DB: PaymentDb
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment-dev}
    ports:
      - "5434:5432" 
    volumes:
      - payment_data:/var/lib/postgresql/data
    networks:
      - booking_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U payment -d PaymentDb"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # --- MICROSERVICIOS payment ---
  payment:
    build:
      context: ./TP-ProgramacionIV
      dockerfile: PaymentAPI/Dockerfile
    image: payment-api:local
    container_name: payment_api
    environment:
      ConnectionStrings__PaymentDb: Host=payment-db;Port=5432;Database=PaymentDb;Username=payment;Password=${PAYMENT_DB_PASSWORD:-payment-dev};GSS Encryption Mode=Disable
      Authentication__Authority: http://keycloak:8080/realms/${KEYCLOAK_REALM:-reservas-realm}
      Authentication__ValidIssuer: http://localhost:8080/realms/${KEYCLOAK_REALM:-reservas-realm}
      Authentication__RequireHttpsMetadata: "false"
      Authentication__ValidateAudience: ${PAYMENT_VALIDATE_AUDIENCE:-false}
      BancoSimulado__RetardoMs: ${PAYMENT_RETARDO_MS:-0}
    ports:
      - "127.0.0.1:5260:8080"
    depends_on:
      payment-db:
        condition: service_healthy
    networks:
      - booking_network
    restart: unless-stopped

  # --- API DE NOTIFICACIONES (Worker Service Dupla 4) ---
  notification-service:
    build: ./TP-ProgramacionIV/NotificationService
    image: notification-service:local
    container_name: notification_service
    ports:
      - "127.0.0.1:5050:5050"
    networks:
      - booking_network
    restart: unless-stopped

networks:
  booking_network:
    driver: bridge

volumes:
  keycloak_data:
  postgres_booking_data:
  payment_data: